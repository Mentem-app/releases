<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none">
  <title>Mentem — A cloud for your agent that stays on when your laptop doesn’t.</title>
  <desc>Mentem wordmark and product headline on a blue background.</desc>
  <rect width="1280" height="440" rx="20" fill="#011BD8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#F5F3EB">
    <text x="64" y="76" font-size="30" font-weight="700" letter-spacing="-1">Mentem</text>
    <text x="60" y="187" font-size="64" font-weight="700" letter-spacing="-2">A cloud for your agent</text>
    <text x="60" y="262" font-size="64" font-weight="700" letter-spacing="-2">that stays on when</text>
    <text x="60" y="337" font-size="64" font-weight="700" letter-spacing="-2">your laptop doesn’t.</text>
  </g>
</svg>
